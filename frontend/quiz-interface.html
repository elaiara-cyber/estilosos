<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SeuEstilo - Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: #fce4e7;
      color: #333;
    }

    .header {
      background: #f8bbd0;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #f48fb1;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ad1457;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header .icon {
      font-size: 1.8rem;
    }

    .quiz-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid #f8bbd0;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #fce4e7;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .progress-fill {
      height: 100%;
      background: #f48fb1;
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .question-number {
      font-size: 0.85rem;
      color: #ad1457;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .question-text {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2rem;
      color: #880e4f;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      gap: 0.75rem;
    }

    .option-btn {
      width: 100%;
      padding: 1rem;
      background: #fce4e7;
      border: 2px solid #f8bbd0;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      color: #c2185b;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .option-btn:hover {
      background: #f8bbd0;
      border-color: #f48fb1;
      transform: translateY(-2px);
    }

    .option-btn:active {
      transform: translateY(0);
    }

    .option-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      background: #f8bbd0;
      border-radius: 8px;
      font-weight: 700;
      color: #ad1457;
      flex-shrink: 0;
    }

    .option-text {
      flex: 1;
      text-align: center;
    }

    .result-container {
      text-align: center;
      padding: 1rem;
    }

    .result-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .result-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ad1457;
      margin-bottom: 1rem;
    }

    .result-desc {
      font-size: 1rem;
      color: #880e4f;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .result-tips {
      background: #fce4e7;
      border-radius: 12px;
      padding: 1rem;
      margin: 1.5rem 0;
      text-align: left;
      font-size: 0.9rem;
      color: #ad1457;
      line-height: 1.6;
    }

    .result-tips h3 {
      color: #c2185b;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .restart-btn {
      background: #f48fb1;
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .restart-btn:hover {
      background: #f8bbd0;
      color: #ad1457;
      transform: translateY(-2px);
    }

    .scores-container {
      margin-top: 1.5rem;
    }

    .score-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .score-label {
      font-size: 0.85rem;
      color: #ad1457;
      width: 100px;
      font-weight: 500;
    }

    .score-bar-container {
      flex: 1;
      height: 8px;
      background: #fce4e7;
      border-radius: 10px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      background: #f48fb1;
      border-radius: 10px;
      min-width: 2px;
    }

    @media (max-width: 600px) {
      .quiz-container {
        margin: 1rem;
        padding: 1.5rem;
      }

      .question-text {
        font-size: 1.2rem;
      }
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: #ad1457;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1><span class="icon">&#128545;</span> SeuEstilo</h1>
  </header>

  <div class="quiz-container">
    <div id="quiz-content">
      <div class="loading">Carregando quiz...</div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';
    const STYLES = {
      'Minimalista': { icon: '◻', color: '#9575cd', desc: 'Peças com corte limpo, cores neutras e tecidos de alta qualidade. Menos é mais.' },
      'Streetwear': { icon: '🛹', color: '#4fc3f7', desc: 'Cultura urbana, gráficos ousados, tênis como destaque.' },
      'Classico': { icon: '🎩', color: '#81c784', desc: 'Cortes tradicionais, tecidos nobres, elegância atemporal.' },
      'Boho': { icon: '🌿', color: '#ffb74d', desc: 'Estampas etnicas, tecidos naturais, acessórios artesanais.' },
      'Casual Chic': { icon: '✨', color: '#f06292', desc: 'Conforto com estilo, mix de peças casuais e refinadas.' }
    };

    let sessaoId = '';
    let perguntas = [];
    let indiceAtual = 0;
    let respostas = {};

    async function initQuiz() {
      try {
        const [resPerguntas, resSessao] = await Promise.all([
          fetch(`${API_BASE}/quiz/perguntas`),
          fetch(`${API_BASE}/quiz/sessao`, { method: 'POST' })
        ]);

        const dadosPerguntas = await resPerguntas.json();
        const dadosSessao = await resSessao.json();

        if (dadosPerguntas.sucesso && dadosSessao.sucesso) {
          perguntas = dadosPerguntas.dados;
          sessaoId = dadosSessao.sessao_id;
          renderizarQuiz();
        }
      } catch (err) {
        document.getElementById('quiz-content').innerHTML = '<div class="loading">Erro ao carregar o quiz. Verifique a API.</div>';
      }
    }

    function renderizarQuiz() {
      const pergunta = perguntas[indiceAtual];
      const progresso = ((indiceAtual + 1) / perguntas.length) * 100;

      let html = '';
      html += `<div class="question-number">Pergunta ${indiceAtual + 1} de ${perguntas.length}</div>`;
      html += `<div class="progress-bar"><div class="progress-fill" style="width: ${progresso}%"></div></div>`;
      html += `<div class="question-text">${pergunta.texto}</div>`;
      html += `<div class="options-grid">`;

      pergunta.opcoes.forEach((opcao, i) => {
        html += `<button class="option-btn" onclick="selecionarOpcao(${i})">
          <div class="option-number">${i + 1}</div>
          <div class="option-text">${opcao.texto}</div>
        </button>`;
      });

      html += `</div>`;
      document.getElementById('quiz-content').innerHTML = html;
    }

    async function selecionarOpcao(opcaoIndex) {
      const pergunta = perguntas[indiceAtual];
      const opcaoId = pergunta.opcoes[opcaoIndex].id;

      try {
        const resposta = await fetch(`${API_BASE}/quiz/resposta`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessao_id: sessaoId,
            pergunta_id: pergunta.id,
            opcao_id: opcaoId
          })
        });

        const resultado = await resposta.json();

        if (resultado.sucesso) {
          if (indiceAtual < perguntas.length - 1) {
            indiceAtual++;
            renderizarQuiz();
          } else {
            renderizarResultado();
          }
        }
      } catch (err) {
        // Silently handle
      }
    }

    async function renderizarResultado() {
      try {
        const resposta = await fetch(`${API_BASE}/quiz/resultado?sessao_id=${sessaoId}`);
        const dados = await resposta.json();

        if (dados.sucesso) {
          const resultado = dados.dados;
          const estilo = resultado.estilo_principal;
          const secundarios = resultado.estilos_secundarios || [];
          const pontuacoes = resultado.todas_pontuacoes || {};
          const total = resultado.pontuacao_total;

          let html = '';
          html += `<div class="result-container">`;
          html += `<div class="result-icon">${estilo.icone}</div>`;
          html += `<div class="result-title">${estilo.nome}</div>`;
          html += `<div class="result-desc">${estilo.descricao}</div>`;

          html += `<div class="result-tips">`;
          html += `<h3>Dicas Práticas</h3>`;
          html += `<pre style="white-space: pre-wrap; font-family: inherit;">${estilo.dicas}</pre>`;
          html += `</div>`;

          if (secundarios.length > 0) {
            html += `<div style="margin: 1.5rem 0; text-align: left;">`;
            html += `<h3 style="color: #ad1457; margin-bottom: 0.75rem; font-size: 1rem;">Estilos Compatíveis</h3>`;
            html += `<div style="display: flex; gap: 1rem; flex-wrap: wrap;">`;
            secundarios.forEach(s => {
              html += `<div style="text-align: center; padding: 0.5rem 1rem; background: #fce4e7; border-radius: 12px;">`;
              html += `<div style="font-size: 1.2rem;">${s.icone}</div>`;
              html += `<div style="font-weight: 600; color: #ad1457; font-size: 0.9rem;">${s.nome}</div>`;
              html += `<div style="font-size: 0.8rem; color: #c2185b;">${s.pontuacao} pts</div>`;
              html += `</div>`;
            });
            html += `</div></div>`;
          }

          html += `<div class="scores-container">`;
          html += `<h3 style="color: #ad1457; margin-bottom: 0.75rem; font-size: 1rem;">Pontuação Completa</h3>`;
          Object.entries(pontuacoes).forEach(([nome, pts]) => {
            const pct = Math.round((pts / total) * 100);
            html += `<div class="score-item">`;
            html += `<span class="score-label">${nome}</span>`;
            html += `<div class="score-bar-container"><div class="score-bar-fill" style="width: ${pct}%"></div></div>`;
            html += `<span style="font-size: 0.8rem; color: #ad1457; min-width: 40px;">${pts} pts</span>`;
            html += `</div>`;
          });
          html += `</div>`;

          html += `<button class="restart-btn" onclick="reiniciarQuiz()">Refazer Quiz</button>`;
          html += `</div>`;

          document.getElementById('quiz-content').innerHTML = html;
        }
      } catch (err) {
        document.getElementById('quiz-content').innerHTML = '<div class="loading">Erro ao carregar resultados.</div>';
      }
    }

    function reiniciarQuiz() {
      indiceAtual = 0;
      respostas = {};
      initQuiz();
    }

    initQuiz();
  </script>
</body>
</div>
</html>
